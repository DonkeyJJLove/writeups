[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heuristic-causal-lab"
version = "4.3.3"
description = "Paired live-model experiments isolating a frozen heuristic from shared tools and validators"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
heuristic-lab = "heuristic_lab.cli:main"

[tool.setuptools.packages.find]
include = ["heuristic_lab*"]

[tool.setuptools.package-data]
heuristic_lab = ["assets/policies/*.txt", "assets/sources/*.txt", "assets/sources/*.json", "assets/configs/*.json", "assets/docs/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
