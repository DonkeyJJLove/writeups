name: Repository Hygiene

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Require canonical README
        run: test -f README.MD || test -f README.md

      - name: Reject tracked local/generated state
        shell: bash
        run: |
          BAD=$(git ls-files | grep -E '(^|/)(\.venv|venv|\.idea|__pycache__)(/|$)|(^|/)\.env\.local$|\.egg-info(/|$)' || true)
          if [ -n "$BAD" ]; then
            echo "Tracked local/generated state violates source-purity invariant:"
            echo "$BAD"
            exit 1
          fi
